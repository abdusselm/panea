name: traffic

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: traffic

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Collect
        env:
          TRAFFIC_TOKEN: ${{ secrets.PANEA_USAGE_COUNT }}
        run: node .github/scripts/collect-traffic.mjs

      - name: Commit the snapshot when it moved
        run: |
          if [ -z "$(git status --porcelain -- data/traffic.json)" ]; then
            echo "nothing new"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/traffic.json
          git commit -m "chore(traffic): daily snapshot"
          git pull --rebase --autostash
          git push
