name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: macos-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      - name: Tag matches package.json
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packaged=$(node -p "require('./package.json').version")
          if [ "$tagged" != "$packaged" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json $packaged"
            exit 1
          fi

      - name: The tarball carries no shell history or completion dumps
        run: |
          if npm pack --dry-run 2>&1 | grep -qiE 'zsh_history|zcompdump'; then
            echo "packaged tarball contains shell runtime files"
            exit 1
          fi

      - name: GitHub release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Homebrew formula checksum
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          for i in $(seq 1 10); do
            if curl -fsSL "$url" -o source.tar.gz; then break; fi
            sleep 3
          done
          echo "Update the tap formula with:"
          echo "  url    $url"
          echo "  sha256 $(shasum -a 256 source.tar.gz | cut -d' ' -f1)"

      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
